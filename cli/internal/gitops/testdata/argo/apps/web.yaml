apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  destination:
    namespace: web
  sources:
    - repoURL: https://charts.example.test
      chart: web
      targetRevision: 1.4.0
      helm:
        releaseName: web-prod
        values: |
          replicas: 3
        valueFiles:
          - $values/web/values.yaml
    - repoURL: https://github.com/example/fleet
      targetRevision: main
      ref: values
