# Shape after the kedacore/keda ScaledJob CRD (Apache-2.0), trimmed to the fields of the case.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scaledjobs.keda.sh
spec:
  group: keda.sh
  names:
    kind: ScaledJob
    plural: scaledjobs
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              jobTargetRef:
                type: object
                properties:
                  template:
                    type: object
                    properties:
                      spec:
                        type: object
                        properties:
                          containers:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                image:
                                  type: string
