apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkas.kafka.strimzi.io
  labels:
    app: strimzi
    strimzi.io/crd-install: "true"
spec:
  group: kafka.strimzi.io
  names:
    kind: Kafka
    listKind: KafkaList
    singular: kafka
    plural: kafkas
    shortNames:
    - k
    categories:
    - strimzi
  scope: Namespaced
  conversion:
    strategy: None
  versions:
  - name: v1
    served: true
    storage: false
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Ready
      description: The state of the custom resource
      jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"
      type: string
    - name: Warnings
      description: Warnings related to the custom resource
      jsonPath: ".status.conditions[?(@.type==\"Warning\")].status"
      type: string
    - name: Kafka version
      description: The Kafka version used by the cluster
      jsonPath: .status.kafkaVersion
      type: string
    - name: Metadata version
      description: The Kafka metadata version used by the cluster
      jsonPath: .status.kafkaMetadataVersion
      type: string
    schema:
      openAPIV3Schema:
        type: object
  - name: v1beta2
    served: true
    storage: true
    deprecated: true
    deprecationWarning: Version v1beta2 of the Kafka API is deprecated. Please use the v1 version instead.
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Ready
      description: The state of the custom resource
      jsonPath: ".status.conditions[?(@.type==\"Ready\")].status"
      type: string
    - name: Warnings
      description: Warnings related to the custom resource
      jsonPath: ".status.conditions[?(@.type==\"Warning\")].status"
      type: string
    - name: Kafka version
      description: The Kafka version used by the cluster
      jsonPath: .status.kafkaVersion
      type: string
    - name: Metadata version
      description: The Kafka metadata version used by the cluster
      jsonPath: .status.kafkaMetadataVersion
      type: string
    schema:
      openAPIV3Schema:
        type: object