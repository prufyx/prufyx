---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ciliumnodes.cilium.io
spec:
  group: cilium.io
  names:
    categories:
    - cilium
    kind: CiliumNode
    listKind: CiliumNodeList
    plural: ciliumnodes
    shortNames:
    - cn
    - ciliumn
    singular: ciliumnode
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Cilium internal IP for this node
      jsonPath: .spec.addresses[?(@.type=="CiliumInternalIP")].ip
      name: CiliumInternalIP
      type: string
    - description: IP of the node
      jsonPath: .spec.addresses[?(@.type=="InternalIP")].ip
      name: InternalIP
      type: string
    - description: Time duration since creation of Ciliumnode
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v2
    schema:
      openAPIV3Schema:
        type: object
    served: true
    storage: true
    subresources:
      status: {}
