name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    # Nightly full run, including the knowledgegate race package.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The nightly run has its own group so a push to main neither cancels it nor is cancelled by it.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  cancel-in-progress: true

# Fast and slow checks. Required on a pull request (the fast set): Build, vet,
# test (fan-in over lint-build and the sharded unit tests), Secret scan, plus
# the Merge policy and Knowledge gate workflows. The slow suites (the three
# synthetic-knowledge jobs) run in the merge queue (merge_group), on push to
# main and nightly. Repository variable CI_FAST_PR=true turns the pull request
# run into the fast set; unset, a pull request still runs everything, so
# nothing is skipped before the merge queue exists. In every other event every
# job must succeed; a skipped job fails the fan-in.
#
# Where jobs run: CI_RUNNER_LABELS is a JSON runs-on value (for example
# ["self-hosted","pfspot"]); unset it is ubuntu-24.04. Only the test shards,
# race, staticcheck and govulncheck read it, and a pull request from a fork
# always gets the hosted runner. Secret scan, race-plan, the fan-in and
# lint-build stay on the hosted runner. Clearing the variable is the rollback.
# Offline runner: the runner-watchdog job (set variable only) cancels the run
# when a self-hosted job stays queued past CI_RUNNER_QUEUE_MINUTES (default 30).
jobs:
  lint-build:
    name: Build, vet, validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The release-notes check below reads two revisions of the history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build
        working-directory: cli
        run: go build -buildvcs=false ./...

      - name: Vet
        working-directory: cli
        run: go vet ./...

      - name: Vet the synthetic-knowledge packages
        working-directory: cli
        run: go vet -tags prufyx_synthetic_knowledge ./internal/cncfcheck/ ./internal/communityapp/ ./internal/extract/extractpack/ ./internal/onecommand/ ./internal/scanrun/ ./internal/maintainer/knowledgegate/ ./internal/maintainer/knowledgetargets/ ./internal/maintainer/knowledgerelease/

      - name: Check knowledge target sizes
        # Fails when any per-project CNCF knowledge target or the index
        # reaches 80% of the 1 MiB per-target cap, when the single-target
        # layout (still the only one the publisher produces) does, or when the
        # summed targets reach 80% of the 7 MiB package member total. The log
        # names the target.
        working-directory: cli
        run: go run ./cmd/prufyx-maintainer knowledge-targets check-size

      - name: Validate community rule candidates
        working-directory: cli
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(contrib/rules/*.json)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "no candidate files under contrib/rules/, nothing to validate"
            exit 0
          fi
          status=0
          for candidate in "${candidates[@]}"; do
            echo "validating ${candidate}"
            if ! go run ./cmd/prufyx-maintainer rule validate --file "${candidate}"; then
              status=1
            fi
          done
          exit "${status}"

      - name: Check generated coverage text
        # README.md coverage block and the CNCF-SOURCE-PREVIEW.md rule counts
        # must match the embedded knowledge and the generated inventory.
        run: |
          scripts/readme-coverage.sh --check
          scripts/preview-coverage.sh --check

      - name: Check release docs
        # The README coverage block, the counts file and, for every release
        # notes file whose tag is not published yet, the notes block, the
        # CHANGELOG entry and the prose around them must be what the
        # generator writes (cli/docs/releasing.md). It runs before the
        # baseline step below, whose shallow fetch of the base branch cuts
        # the history this command needs. The vendor and model name list is
        # read from the repository variable RELEASE_DENY_NAMES when it is
        # set; without it that one list is skipped and the output says so
        # (the release cut and the release workflow always apply it).
        working-directory: cli
        env:
          DENY_NAMES: ${{ vars.RELEASE_DENY_NAMES }}
        run: |
          set -euo pipefail
          deny_args=()
          if [ -n "${DENY_NAMES}" ]; then
            deny="${RUNNER_TEMP}/deny-names.txt"
            printf '%s\n' "${DENY_NAMES}" > "${deny}"
            deny_args=(--deny-file "${deny}")
          fi
          go run ./cmd/prufyx-maintainer release-docs check --root .. --mode unreleased "${deny_args[@]}"

      - name: Check published release notes are unchanged
        # For every version tag, the generated block of its notes file and its
        # CHANGELOG entry must equal the base branch. Fail closed: no base ref,
        # a failed fetch of the base or the tags, or no visible tag fails the
        # step. It runs before the baseline step below, whose shallow fetch
        # makes the repository shallow. Pull requests only, as that step.
        if: github.event_name == 'pull_request'
        working-directory: cli
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ]; then
            echo "::error::no base ref for this pull request, cannot compare the published release notes"
            exit 1
          fi
          if ! git fetch --tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
            echo "::error::cannot fetch base ref ${BASE_REF} and the tags, cannot compare the published release notes"
            exit 1
          fi
          go run ./cmd/prufyx-maintainer release-docs published --root .. --base "refs/remotes/origin/${BASE_REF}"

      - name: Check the coverage baseline is not lowered
        # The decided-pair and covered-project floors in
        # readme-baseline.json may not be lowered, and a project floor may not
        # be removed, relative to the base branch. A number may fall only
        # through a new named withdrawal entry in the same file.
        # Fail closed: a missing or unreadable base file, an unreachable base
        # ref, or a missing head file fails the step. It runs on pull requests
        # only: on a push the base would be the pushed commit itself, and a
        # file compared with itself proves nothing. That a pull request has
        # passed this step before main moves depends on branch protection
        # (required status check, up to date, code-owner review); a direct
        # push to main skips the step by design.
        if: github.event_name == 'pull_request'
        working-directory: cli
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          path=cli/internal/maintainer/coveragereport/testdata/readme-baseline.json
          if [ -z "${BASE_REF}" ]; then
            echo "::error::no base ref for this pull request, cannot compare the baseline"
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin "${BASE_REF}"; then
            echo "::error::cannot fetch base ref ${BASE_REF}, cannot compare the baseline"
            exit 1
          fi
          if ! git cat-file -e "FETCH_HEAD:${path}"; then
            echo "::error::${path} is missing on ${BASE_REF}; the baseline must exist on the base branch"
            exit 1
          fi
          if [ ! -s "../${path}" ]; then
            echo "::error::${path} is missing or empty in this change; the baseline may not be deleted"
            exit 1
          fi
          git show "FETCH_HEAD:${path}" > "${RUNNER_TEMP}/readme-baseline-main.json"
          if [ ! -s "${RUNNER_TEMP}/readme-baseline-main.json" ]; then
            echo "::error::${path} on ${BASE_REF} is empty"
            exit 1
          fi
          PRUFYX_BASELINE_REQUIRED=1 PRUFYX_BASELINE_MAIN="${RUNNER_TEMP}/readme-baseline-main.json" \
            go test ./internal/maintainer/coveragereport/ -run 'TestBaselineNotLowered' -count=1

  test-core:
    # Sharded by package group so the slowest packages run side by side. The
    # last group ("rest") is every package that is in no other group and is not
    # the knowledgegate package (which has its own sharded job), so a new
    # package is always tested.
    name: Test (${{ matrix.group }})
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 40
    env:
      # Every explicitly grouped package; the "rest" group excludes these.
      CORE_GROUPED: >-
        ./internal/maintainer/evidencereattest/
        ./cmd/prufyx-maintainer/ ./cmd/prufyx-community/
        ./internal/cncfcheck/ ./internal/communityapp/
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core-evidence
            packages: ./internal/maintainer/evidencereattest/
          - group: core-commands
            packages: ./cmd/prufyx-maintainer/ ./cmd/prufyx-community/ ./internal/cncfcheck/ ./internal/communityapp/
          # The catch-all is split over two jobs by package number
          # (TestCICoreGroupsAreComplete keeps every package in exactly one).
          - group: core-rest-1
            packages: ""
            rest_index: "1"
            rest_total: "2"
          - group: core-rest-2
            packages: ""
            rest_index: "2"
            rest_total: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history and tags: the listed-family floor test reads them.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The oldest supported client is built from its pinned commit and run
      # against a package that carries the listed family: it must exit 15
      # (too new), not fail the package as an integrity error.
      - name: Pinned client refuses the listed family as too new
        if: ${{ matrix.group == 'core-commands' }}
        working-directory: cli
        run: |
          set -euo pipefail
          pin="knowledge/oldest-supported-client.txt"
          [ "$(grep -c '' "${pin}")" = 2 ] || { echo "${pin} must hold exactly two lines" >&2; exit 1; }
          ref="$(sed -n '1p' "${pin}")"
          [[ "${ref}" =~ ^ref=[0-9a-f]{40}$ ]] || { echo "the ref line of ${pin} is not a 40-hex commit" >&2; exit 1; }
          src="${RUNNER_TEMP}/pinned-client"
          mkdir -m 700 "${src}"
          # Archive from the repository root: run inside cli/, git archive
          # would only hold the cli/ subtree and drop the cli/ prefix.
          git -C "${GITHUB_WORKSPACE}" archive "${ref#ref=}" | tar -x -C "${src}"
          PRUFYX_PINNED_CLIENT_SRC="${src}" go test -timeout 40m -count=1 -run TestOldestClientRefusesListedFamilyTooNew -v ./internal/maintainer/knowledgerelease/

      - name: Test
        working-directory: cli
        env:
          GROUP: ${{ matrix.group }}
          GROUP_PACKAGES: ${{ matrix.packages }}
          REST_INDEX: ${{ matrix.rest_index }}
          REST_TOTAL: ${{ matrix.rest_total }}
        # Some packages exceed go test's default 10-minute limit on hosted runners; keep a generous limit.
        # The knowledgegate package has its own job (test-knowledgegate).
        run: |
          set -euo pipefail
          if [ -n "${GROUP_PACKAGES}" ]; then
            # shellcheck disable=SC2086
            packages=$(go list ${GROUP_PACKAGES})
          else
            # shellcheck disable=SC2086
            grouped=$(go list ${CORE_GROUPED})
            packages=$(go list ./... | grep -v '/internal/maintainer/knowledgegate$' | grep -vxF "${grouped}" | sort)
            if [ -n "${REST_TOTAL}" ]; then
              # Package number N (1-based, sorted) belongs to part ((N-1) mod TOTAL)+1.
              packages=$(printf '%s\n' "${packages}" | awk -v n="${REST_TOTAL}" -v i="${REST_INDEX}" '(NR-1)%n==i-1')
            fi
          fi
          if [ -z "${packages}" ]; then
            echo "${GROUP}: no packages selected; a missing proof is a failure" >&2
            exit 1
          fi
          echo "${GROUP}: $(printf '%s\n' "${packages}" | grep -c .) packages"
          # shellcheck disable=SC2086
          go test -timeout 60m -covermode=atomic -coverprofile="coverage-${GROUP}.out" ${packages}

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.group }}
          path: cli/coverage-${{ matrix.group }}.out
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  test-knowledgegate:
    # The package is slow on its own, so its tests are spread over SHARDS jobs
    # by scripts/ci-test-shard.sh (every test is in exactly one shard;
    # TestCIShardsAreComplete keeps the matrix and SHARDS in step).
    name: Test (knowledgegate ${{ matrix.shard }}/4)
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 40
    env:
      SHARDS: "4"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test
        working-directory: cli
        env:
          SHARD: ${{ matrix.shard }}
        run: ../scripts/ci-test-shard.sh "${SHARD}" "${SHARDS}" ./internal/maintainer/knowledgegate/ -- -timeout 40m -covermode=atomic -coverprofile="coverage-knowledgegate-${SHARD}.out"

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-knowledgegate-${{ matrix.shard }}
          path: cli/coverage-knowledgegate-${{ matrix.shard }}.out
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # The tagged suite (build tag prufyx_synthetic_knowledge) is split over three
  # job kinds so the slow knowledgegate package does not hold up the others.
  # Every package with a tagged file is listed in exactly one of them, and no
  # run has a -run or -skip filter in this file
  # (TestCISyntheticPackagesAreCovered fails when a package is missing).
  test-synthetic-a:
    name: Test (synthetic knowledge, cncfcheck and community)
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 75
    if: github.event_name != 'pull_request' || vars.CI_FAST_PR != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history and tags: the listed-family floor test reads them.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test command routes against synthetic knowledge
        working-directory: cli
        run: |
          go test -timeout 60m -tags prufyx_synthetic_knowledge ./internal/cncfcheck/ ./internal/communityapp/ ./internal/onecommand/

  test-synthetic-b:
    name: Test (synthetic knowledge, extract, scan and release)
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 75
    if: github.event_name != 'pull_request' || vars.CI_FAST_PR != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test command routes against synthetic knowledge
        working-directory: cli
        run: |
          go test -timeout 60m -tags prufyx_synthetic_knowledge ./internal/extract/extractpack/ ./internal/scanrun/ ./internal/maintainer/knowledgetargets/ ./internal/maintainer/knowledgerelease/

  test-synthetic-knowledgegate:
    name: Test (synthetic knowledge, knowledgegate ${{ matrix.shard }}/3)
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 75
    if: github.event_name != 'pull_request' || vars.CI_FAST_PR != 'true'
    env:
      SHARDS: "3"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test command routes against synthetic knowledge
        working-directory: cli
        env:
          SHARD: ${{ matrix.shard }}
        run: ../scripts/ci-test-shard.sh "${SHARD}" "${SHARDS}" ./internal/maintainer/knowledgegate/ -tags prufyx_synthetic_knowledge -- -timeout 60m

  build-test:
    # Fan-in: the required check keeps its name. It passes only when every
    # shard job succeeded; a skipped or cancelled shard fails it
    # (TestCIFanInCoversEveryTestJob keeps the needs list complete).
    name: Build, vet, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint-build, test-core, test-knowledgegate, test-synthetic-a, test-synthetic-b, test-synthetic-knowledgegate]
    if: always()
    steps:
      - name: Require every shard to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          # The fast set must always succeed. The slow set must succeed too,
          # except in a pull request run with CI_FAST_PR=true, where it is
          # skipped by construction (and still may not fail).
          FAST_RESULTS: ${{ needs.lint-build.result }} ${{ needs.test-core.result }} ${{ needs.test-knowledgegate.result }}
          SLOW_RESULTS: ${{ needs.test-synthetic-a.result }} ${{ needs.test-synthetic-b.result }} ${{ needs.test-synthetic-knowledgegate.result }}
          SLOW_MAY_SKIP: ${{ github.event_name == 'pull_request' && vars.CI_FAST_PR == 'true' }}
        run: |
          echo "shard results: ${RESULTS}"
          results="${RESULTS}"
          if [ "${SLOW_MAY_SKIP}" = "true" ]; then
            results="${FAST_RESULTS}"
            for r in ${SLOW_RESULTS}; do
              if [ "${r}" != "skipped" ] && [ "${r}" != "success" ]; then
                echo "a slow suite did not succeed (${r})" >&2
                exit 1
              fi
            done
          fi
          if [ -z "${results}" ]; then
            echo "no shard results" >&2
            exit 1
          fi
          for r in ${results}; do
            if [ "${r}" != "success" ]; then
              echo "a shard did not succeed (${r})" >&2
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Download shard coverage profiles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-shards

      - name: Merge coverage profiles
        run: |
          set -euo pipefail
          mkdir -p cli
          { echo "mode: atomic"; tail -q -n +2 coverage-shards/*/coverage-*.out; } > cli/coverage.out
          cd cli
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-out
          path: cli/coverage.out
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  race-plan:
    name: Race detector plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Select race packages
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        # Pull requests and merge queue entries race only the packages whose
        # import closure (with tests) contains a changed file; push to main,
        # nightly and manual runs race the full list, so every commit that
        # reaches main is raced. A merge queue entry whose base cannot be read
        # races everything (never fewer packages).
        run: |
          set -euo pipefail
          base_packages="./internal/scanreport/ ./internal/scanrun/ ./internal/cncfcheck/ ./internal/constraintengine/ ./internal/knowledge/ ./internal/maintainer/rulecheck/ ./internal/knowledgeauto/ ./internal/communityapp/"
          root=$(pwd)
          cd cli
          selected=""
          if [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "merge_group" ]; then
            if [ "${EVENT_NAME}" = "merge_group" ]; then
              # The queue builds the pull request merged into the tip of the base.
              if [[ "${MERGE_GROUP_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] && changed=$(git diff --no-renames --name-only "${MERGE_GROUP_BASE_SHA}" HEAD) && [ -n "${changed}" ]; then
                :
              else
                echo "merge group base unreadable or empty diff: all packages"
                changed=".github/unresolved"
              fi
            else
              changed=$(git diff --no-renames --name-only origin/main...HEAD)
            fi
            echo "changed files: $(printf '%s\n' "${changed}" | grep -c . || true)"
            # A change to the workflows, the module files or vendor/ can affect every package.
            if printf '%s\n' "${changed}" | grep -Eq '^\.github/|^cli/examples/|(^|/)go\.(mod|sum)$|(^|/)vendor/'; then
              echo "workflow, module, vendor or examples change: all packages"
              selected="${base_packages}"
            else
              for pkg in ${base_packages}; do
                # Directories of this repository's packages in the import closure of the
                # package and of its tests; a changed file under one of them (Go source,
                # embedded data, testdata) selects the package.
                dirs=$(go list -buildvcs=false -deps -test -f '{{if .Module}}{{if .Module.Main}}{{.Dir}}{{end}}{{end}}' "${pkg}" | sort -u)
                hit=""
                while IFS= read -r file; do
                  [ -n "${file}" ] || continue
                  abs="${root}/${file}"
                  while IFS= read -r dir; do
                    [ -n "${dir}" ] || continue
                    case "${abs}" in "${dir}"/*) hit="${file}"; break ;; esac
                  done <<< "${dirs}"
                  [ -z "${hit}" ] || break
                done <<< "${changed}"
                if [ -n "${hit}" ]; then
                  echo "${pkg} affected by ${hit}"
                  selected="${selected} ${pkg}"
                fi
              done
            fi
          else
            # push to main, schedule, workflow_dispatch: the full list.
            selected="${base_packages}"
          fi
          matrix=$(for pkg in ${selected}; do
            # communityapp has the slowest end-to-end tests (one runs ~12 min under -race
            # on an idle 10-core host); it gets the same budget as the nightly package.
            if [ "${pkg}" = "./internal/communityapp/" ]; then
              jq -cn --arg p "${pkg}" '{package: $p, timeout_minutes: 90, go_timeout: "85m"}'
            else
              jq -cn --arg p "${pkg}" '{package: $p, timeout_minutes: 50, go_timeout: "40m"}'
            fi
          done | jq -cs '.')
          if [ "${EVENT_NAME}" = "schedule" ]; then
            # knowledgegate is too slow under -race for every commit; the nightly covers it.
            matrix=$(printf '%s' "${matrix}" | jq -c '. + [{package: "./internal/maintainer/knowledgegate/", timeout_minutes: 90, go_timeout: "85m"}]')
          fi
          echo "race matrix: ${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT:-/dev/stdout}"

  race:
    name: Race detector (${{ matrix.package }})
    needs: race-plan
    if: needs.race-plan.outputs.matrix != '[]'
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.race-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history and tags: the listed-family floor test reads them.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test with the race detector
        working-directory: cli
        env:
          CGO_ENABLED: "1"
          RACE_PACKAGE: ${{ matrix.package }}
          RACE_TIMEOUT: ${{ matrix.go_timeout }}
        # Published binaries stay CGO_ENABLED=0; only this job needs cgo for -race.
        # knowledgegate is raced by the nightly run only: under -race it ran past
        # 60 minutes (it already runs in the test-knowledgegate job, also with the tag).
        run: go test -race -timeout "${RACE_TIMEOUT}" "${RACE_PACKAGE}"

  staticcheck:
    name: Staticcheck
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      STATICCHECK_VERSION: 2026.2.1
      STATICCHECK_SHA256: 91186205a78db3f2d40efb3c102749aef66f85c2204793de7488d163b655aa7c
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install staticcheck
        # Not vendored (go.mod/go.sum/vendor stay untouched): the release
        # binary is pinned by version and verified against a hard-coded digest.
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 20 --max-time 180 -o staticcheck_linux_amd64.tar.gz "https://github.com/dominikh/go-tools/releases/download/${STATICCHECK_VERSION}/staticcheck_linux_amd64.tar.gz"
          echo "${STATICCHECK_SHA256}  staticcheck_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf staticcheck_linux_amd64.tar.gz staticcheck/staticcheck
          install -m 0755 staticcheck/staticcheck /usr/local/bin/staticcheck
          rm -rf staticcheck staticcheck_linux_amd64.tar.gz
          staticcheck -version

      - name: Staticcheck (SA checks, default and parityreview tags)
        working-directory: cli
        env:
          GOWORK: "off"
          GOPROXY: "off"
          GOSUMDB: "off"
          GOFLAGS: -mod=vendor -buildvcs=false
        run: |
          status=0
          staticcheck -checks='SA*' ./... || status=1
          staticcheck -checks='SA*' -tags parityreview ./... || status=1
          exit "${status}"

  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ${{ (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      GOVULNCHECK_VERSION: v1.9.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Scans with the newest Go patch release so a stdlib fix is what is scanned
      # (1.26.11 fixes GO-2026-6859); release builds stay on their pinned
      # toolchain. setup-go reads the go directive, not the toolchain line, of
      # go.mod.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.11"
          cache-dependency-path: cli/go.sum

      - name: Install govulncheck
        # Not vendored: pinned by exact version; module checksums are verified
        # through the Go checksum database.
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Scan the CLI module (fails on any reachable vulnerability)
        working-directory: cli
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/govulncheck" ./...

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # --fail: an HTTP error page is an error, never a file. The digest is still verified before extraction.
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 15 --connect-timeout 20 --max-time 180 -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks dir .

  runner-watchdog:
    # Only when CI_RUNNER_LABELS is set. A job that waits for a self-hosted
    # runner that is offline stays queued for up to 24 hours (timeout-minutes
    # counts from the start), and the fan-in would never report. This hosted
    # job cancels the run when a self-hosted job has been queued longer than
    # CI_RUNNER_QUEUE_MINUTES (default 30), or when the job list cannot be
    # read: the run then ends cancelled, which no required check accepts.
    name: Runner watchdog
    if: vars.CI_RUNNER_LABELS != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      MAX_QUEUE_MINUTES: ${{ vars.CI_RUNNER_QUEUE_MINUTES }}
    steps:
      - name: Cancel the run when a self-hosted job is stuck in the queue
        run: |
          set -uo pipefail
          case "${MAX_QUEUE_MINUTES}" in
            ''|*[!0-9]*) MAX_QUEUE_MINUTES=30 ;;
          esac
          max=$(( MAX_QUEUE_MINUTES * 60 ))
          cancel() {
            echo "::error::${1}; cancelling the run"
            gh run cancel "${RUN_ID}" -R "${REPO}"
            exit 1
          }
          while true; do
            jobs=$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '.jobs[] | {name, status, labels, created_at}') || cancel "the job list cannot be read"
            now=$(date +%s)
            stale=$(printf '%s\n' "${jobs}" | jq -s --argjson now "${now}" --argjson max "${max}" '[.[] | select(.status == "queued" and ((.labels // []) | index("self-hosted")) != null and ($now - (.created_at | fromdateiso8601)) > $max)] | length') || cancel "the job list cannot be parsed"
            [ "${stale}" = "0" ] || cancel "a self-hosted job has waited more than ${MAX_QUEUE_MINUTES} minutes for a runner"
            open=$(printf '%s\n' "${jobs}" | jq -s '[.[] | select(.status != "completed" and .name != "Runner watchdog")] | length') || cancel "the job list cannot be parsed"
            [ "${open}" != "0" ] || exit 0
            sleep 30
          done
