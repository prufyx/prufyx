name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full run, including the knowledgegate race package.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The nightly run has its own group so a push to main neither cancels it nor is cancelled by it.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Build, vet, validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build
        working-directory: cli
        run: go build -buildvcs=false ./...

      - name: Vet
        working-directory: cli
        run: go vet ./...

      - name: Vet the synthetic-knowledge packages
        working-directory: cli
        run: go vet -tags prufyx_synthetic_knowledge ./internal/cncfcheck/ ./internal/communityapp/ ./internal/extract/extractpack/ ./internal/onecommand/ ./internal/scanrun/ ./internal/maintainer/knowledgegate/ ./internal/maintainer/knowledgetargets/ ./internal/maintainer/knowledgerelease/

      - name: Check knowledge target sizes
        # Fails when any per-project CNCF knowledge target or the index
        # reaches 80% of the 1 MiB per-target cap, when the single-target
        # layout (still the only one the publisher produces) does, or when the
        # summed targets reach 80% of the 7 MiB package member total. The log
        # names the target.
        working-directory: cli
        run: go run ./cmd/prufyx-maintainer knowledge-targets check-size

      - name: Validate community rule candidates
        working-directory: cli
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(contrib/rules/*.json)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "no candidate files under contrib/rules/, nothing to validate"
            exit 0
          fi
          status=0
          for candidate in "${candidates[@]}"; do
            echo "validating ${candidate}"
            if ! go run ./cmd/prufyx-maintainer rule validate --file "${candidate}"; then
              status=1
            fi
          done
          exit "${status}"

      - name: Check generated coverage text
        # README.md coverage block and the CNCF-SOURCE-PREVIEW.md rule counts
        # must match the embedded knowledge and the generated inventory.
        run: |
          scripts/readme-coverage.sh --check
          scripts/preview-coverage.sh --check

  test-core:
    # Sharded by package group so the slowest packages run side by side. The
    # last group ("rest") is every package that is in no other group and is not
    # the knowledgegate package (which has its own sharded job), so a new
    # package is always tested.
    name: Test (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Every explicitly grouped package; the "rest" group excludes these.
      CORE_GROUPED: >-
        ./internal/maintainer/evidencereattest/
        ./cmd/prufyx-maintainer/ ./cmd/prufyx-community/
        ./internal/cncfcheck/ ./internal/communityapp/
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core-evidence
            packages: ./internal/maintainer/evidencereattest/
          - group: core-commands
            packages: ./cmd/prufyx-maintainer/ ./cmd/prufyx-community/ ./internal/cncfcheck/ ./internal/communityapp/
          - group: core-rest
            packages: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test
        working-directory: cli
        env:
          GROUP: ${{ matrix.group }}
          GROUP_PACKAGES: ${{ matrix.packages }}
        # Some packages exceed go test's default 10-minute limit on hosted runners; keep a generous limit.
        # The knowledgegate package has its own job (test-knowledgegate).
        run: |
          set -euo pipefail
          if [ -n "${GROUP_PACKAGES}" ]; then
            # shellcheck disable=SC2086
            packages=$(go list ${GROUP_PACKAGES})
          else
            # shellcheck disable=SC2086
            grouped=$(go list ${CORE_GROUPED})
            packages=$(go list ./... | grep -v '/internal/maintainer/knowledgegate$' | grep -vxF "${grouped}")
          fi
          echo "${GROUP}: $(printf '%s\n' "${packages}" | grep -c .) packages"
          # shellcheck disable=SC2086
          go test -timeout 60m -covermode=atomic -coverprofile="coverage-${GROUP}.out" ${packages}

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.group }}
          path: cli/coverage-${{ matrix.group }}.out
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  test-knowledgegate:
    # The package is slow on its own, so its tests are spread over SHARDS jobs
    # by scripts/ci-test-shard.sh (every test is in exactly one shard;
    # TestCIShardsAreComplete keeps the matrix and SHARDS in step).
    name: Test (knowledgegate ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SHARDS: "3"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test
        working-directory: cli
        env:
          SHARD: ${{ matrix.shard }}
        run: ../scripts/ci-test-shard.sh "${SHARD}" "${SHARDS}" ./internal/maintainer/knowledgegate/ -- -timeout 40m -covermode=atomic -coverprofile="coverage-knowledgegate-${SHARD}.out"

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-knowledgegate-${{ matrix.shard }}
          path: cli/coverage-knowledgegate-${{ matrix.shard }}.out
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # The tagged suite (build tag prufyx_synthetic_knowledge) is split over three
  # job kinds so the slow knowledgegate package does not hold up the others.
  # Every package with a tagged file is listed in exactly one of them, and no
  # run has a -run or -skip filter in this file
  # (TestCISyntheticPackagesAreCovered fails when a package is missing).
  test-synthetic-a:
    name: Test (synthetic knowledge, cncfcheck and community)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test command routes against synthetic knowledge
        working-directory: cli
        run: |
          go test -timeout 60m -tags prufyx_synthetic_knowledge ./internal/cncfcheck/ ./internal/communityapp/ ./internal/onecommand/

  test-synthetic-b:
    name: Test (synthetic knowledge, extract, scan and release)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test command routes against synthetic knowledge
        working-directory: cli
        run: |
          go test -timeout 60m -tags prufyx_synthetic_knowledge ./internal/extract/extractpack/ ./internal/scanrun/ ./internal/maintainer/knowledgetargets/ ./internal/maintainer/knowledgerelease/

  test-synthetic-knowledgegate:
    name: Test (synthetic knowledge, knowledgegate ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SHARDS: "3"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test command routes against synthetic knowledge
        working-directory: cli
        env:
          SHARD: ${{ matrix.shard }}
        run: ../scripts/ci-test-shard.sh "${SHARD}" "${SHARDS}" ./internal/maintainer/knowledgegate/ -tags prufyx_synthetic_knowledge -- -timeout 60m

  build-test:
    # Fan-in: the required check keeps its name. It passes only when every
    # shard job succeeded; a skipped or cancelled shard fails it
    # (TestCIFanInCoversEveryTestJob keeps the needs list complete).
    name: Build, vet, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint-build, test-core, test-knowledgegate, test-synthetic-a, test-synthetic-b, test-synthetic-knowledgegate]
    if: always()
    steps:
      - name: Require every shard to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "shard results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "a shard did not succeed (${r})" >&2
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Download shard coverage profiles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-shards

      - name: Merge coverage profiles
        run: |
          set -euo pipefail
          mkdir -p cli
          { echo "mode: atomic"; tail -q -n +2 coverage-shards/*/coverage-*.out; } > cli/coverage.out
          cd cli
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-out
          path: cli/coverage.out
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  race-plan:
    name: Race detector plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Select race packages
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Pull requests race only the packages whose import closure (with tests)
        # contains a changed file; push to main, merge queue, nightly and manual
        # runs race the full list, so every commit that reaches main is raced.
        run: |
          set -euo pipefail
          base_packages="./internal/scanreport/ ./internal/scanrun/ ./internal/cncfcheck/ ./internal/constraintengine/ ./internal/knowledge/ ./internal/maintainer/rulecheck/"
          root=$(pwd)
          cd cli
          selected=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            changed=$(git diff --no-renames --name-only origin/main...HEAD)
            echo "changed files: $(printf '%s\n' "${changed}" | grep -c . || true)"
            # A change to the workflows, the module files or vendor/ can affect every package.
            if printf '%s\n' "${changed}" | grep -Eq '^\.github/|^cli/examples/|(^|/)go\.(mod|sum)$|(^|/)vendor/'; then
              echo "workflow, module, vendor or examples change: all packages"
              selected="${base_packages}"
            else
              for pkg in ${base_packages}; do
                # Directories of this repository's packages in the import closure of the
                # package and of its tests; a changed file under one of them (Go source,
                # embedded data, testdata) selects the package.
                dirs=$(go list -buildvcs=false -deps -test -f '{{if .Module}}{{if .Module.Main}}{{.Dir}}{{end}}{{end}}' "${pkg}" | sort -u)
                hit=""
                while IFS= read -r file; do
                  [ -n "${file}" ] || continue
                  abs="${root}/${file}"
                  while IFS= read -r dir; do
                    [ -n "${dir}" ] || continue
                    case "${abs}" in "${dir}"/*) hit="${file}"; break ;; esac
                  done <<< "${dirs}"
                  [ -z "${hit}" ] || break
                done <<< "${changed}"
                if [ -n "${hit}" ]; then
                  echo "${pkg} affected by ${hit}"
                  selected="${selected} ${pkg}"
                fi
              done
            fi
          else
            # push to main, merge_group, schedule, workflow_dispatch: the full list.
            selected="${base_packages}"
          fi
          matrix=$(for pkg in ${selected}; do
            jq -cn --arg p "${pkg}" '{package: $p, timeout_minutes: 50, go_timeout: "40m"}'
          done | jq -cs '.')
          if [ "${EVENT_NAME}" = "schedule" ]; then
            # knowledgegate is too slow under -race for every commit; the nightly covers it.
            matrix=$(printf '%s' "${matrix}" | jq -c '. + [{package: "./internal/maintainer/knowledgegate/", timeout_minutes: 90, go_timeout: "85m"}]')
          fi
          echo "race matrix: ${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT:-/dev/stdout}"

  race:
    name: Race detector (${{ matrix.package }})
    needs: race-plan
    if: needs.race-plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.race-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test with the race detector
        working-directory: cli
        env:
          CGO_ENABLED: "1"
          RACE_PACKAGE: ${{ matrix.package }}
          RACE_TIMEOUT: ${{ matrix.go_timeout }}
        # Published binaries stay CGO_ENABLED=0; only this job needs cgo for -race.
        # knowledgegate is raced by the nightly run only: under -race it ran past
        # 60 minutes (it already runs in the test-knowledgegate job, also with the tag).
        run: go test -race -timeout "${RACE_TIMEOUT}" "${RACE_PACKAGE}"

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STATICCHECK_VERSION: 2026.2.1
      STATICCHECK_SHA256: 91186205a78db3f2d40efb3c102749aef66f85c2204793de7488d163b655aa7c
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install staticcheck
        # Not vendored (go.mod/go.sum/vendor stay untouched): the release
        # binary is pinned by version and verified against a hard-coded digest.
        run: |
          set -euo pipefail
          curl -sSLO "https://github.com/dominikh/go-tools/releases/download/${STATICCHECK_VERSION}/staticcheck_linux_amd64.tar.gz"
          echo "${STATICCHECK_SHA256}  staticcheck_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf staticcheck_linux_amd64.tar.gz staticcheck/staticcheck
          install -m 0755 staticcheck/staticcheck /usr/local/bin/staticcheck
          rm -rf staticcheck staticcheck_linux_amd64.tar.gz
          staticcheck -version

      - name: Staticcheck (SA checks, default and parityreview tags)
        working-directory: cli
        env:
          GOWORK: "off"
          GOPROXY: "off"
          GOSUMDB: "off"
          GOFLAGS: -mod=vendor -buildvcs=false
        run: |
          status=0
          staticcheck -checks='SA*' ./... || status=1
          staticcheck -checks='SA*' -tags parityreview ./... || status=1
          exit "${status}"

  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOVULNCHECK_VERSION: v1.9.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The release toolchain patch release, so a stdlib fix is what is scanned
      # (setup-go reads the go directive, not the toolchain line, of go.mod).
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: cli/go.sum

      - name: Install govulncheck
        # Not vendored: pinned by exact version; module checksums are verified
        # through the Go checksum database.
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Scan the CLI module (fails on any reachable vulnerability)
        working-directory: cli
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/govulncheck" ./...

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks dir .
