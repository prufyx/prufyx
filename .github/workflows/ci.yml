name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, vet, test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build
        working-directory: cli
        run: go build -buildvcs=false ./...

      - name: Vet
        working-directory: cli
        run: go vet ./...

      - name: Test
        working-directory: cli
        # Some packages exceed go test's default 10-minute limit on hosted runners; keep the generous limit (the communityapp tests now run in parallel).
        run: |
          go test -timeout 60m -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-out
          path: cli/coverage.out
          retention-days: 14
          if-no-files-found: error

      - name: Check knowledge target sizes
        # Fails when any per-project CNCF knowledge target or the index
        # reaches 80% of the 1 MiB per-target cap, when the single-target
        # layout (still the only one the publisher produces) does, or when the
        # summed targets reach 80% of the 7 MiB package member total. The log
        # names the target.
        working-directory: cli
        run: go run ./cmd/prufyx-maintainer knowledge-targets check-size

      - name: Test command routes against synthetic knowledge
        working-directory: cli
        # Every package with a prufyx_synthetic_knowledge file is listed, and the
        # run has no -run filter, so a tagged test is never skipped for its name
        # (TestCISyntheticPackagesAreCovered fails when a package is missing).
        run: |
          go vet -tags prufyx_synthetic_knowledge ./internal/cncfcheck/ ./internal/communityapp/ ./internal/extract/extractpack/ ./internal/onecommand/ ./internal/scanrun/ ./internal/maintainer/knowledgegate/ ./internal/maintainer/knowledgetargets/ ./internal/maintainer/knowledgerelease/
          go test -timeout 60m -tags prufyx_synthetic_knowledge ./internal/cncfcheck/ ./internal/communityapp/ ./internal/extract/extractpack/ ./internal/onecommand/ ./internal/scanrun/ ./internal/maintainer/knowledgegate/ ./internal/maintainer/knowledgetargets/ ./internal/maintainer/knowledgerelease/

      - name: Validate community rule candidates
        working-directory: cli
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(contrib/rules/*.json)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "no candidate files under contrib/rules/, nothing to validate"
            exit 0
          fi
          status=0
          for candidate in "${candidates[@]}"; do
            echo "validating ${candidate}"
            if ! go run ./cmd/prufyx-maintainer rule validate --file "${candidate}"; then
              status=1
            fi
          done
          exit "${status}"

  race:
    name: Race detector (verdict packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Test with the race detector
        working-directory: cli
        env:
          CGO_ENABLED: "1"
        # Published binaries stay CGO_ENABLED=0; only this job needs cgo for -race.
        # knowledgegate is not in the race list: under -race it ran past 60 minutes
        # (it already runs in the build-test job, which also runs it with the tag).
        run: |
          go test -race -timeout 25m \
            ./internal/scanreport/ ./internal/scanrun/ ./internal/cncfcheck/ \
            ./internal/constraintengine/ ./internal/knowledge/ \
            ./internal/maintainer/rulecheck/

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STATICCHECK_VERSION: 2026.2.1
      STATICCHECK_SHA256: 91186205a78db3f2d40efb3c102749aef66f85c2204793de7488d163b655aa7c
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Install staticcheck
        # Not vendored (go.mod/go.sum/vendor stay untouched): the release
        # binary is pinned by version and verified against a hard-coded digest.
        run: |
          set -euo pipefail
          curl -sSLO "https://github.com/dominikh/go-tools/releases/download/${STATICCHECK_VERSION}/staticcheck_linux_amd64.tar.gz"
          echo "${STATICCHECK_SHA256}  staticcheck_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf staticcheck_linux_amd64.tar.gz staticcheck/staticcheck
          install -m 0755 staticcheck/staticcheck /usr/local/bin/staticcheck
          rm -rf staticcheck staticcheck_linux_amd64.tar.gz
          staticcheck -version

      - name: Staticcheck (SA checks, default and parityreview tags)
        working-directory: cli
        env:
          GOWORK: "off"
          GOPROXY: "off"
          GOSUMDB: "off"
          GOFLAGS: -mod=vendor -buildvcs=false
        run: |
          status=0
          staticcheck -checks='SA*' ./... || status=1
          staticcheck -checks='SA*' -tags parityreview ./... || status=1
          exit "${status}"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks dir .
