name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      # The tag must be one the binary's build identity accepts (the grammar
      # of internal/buildidentity) and that scripts/action/install.sh accepts
      # (no build metadata: "+" in a release asset URL is fragile; a
      # pre-release starts with a letter or digit, as in install.sh); anything
      # else stops before a build.
      - name: Check the tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z-]*(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "${VERSION}" =~ ${semver} ]]; then
            echo "The tag is not a v-prefixed semantic version; nothing was built."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The official knowledge root pin. With the repository variable
      # KNOWLEDGE_ROOT_DIGEST unset nothing is checked (a release without a
      # pinned feed root). With it set, the embedded root file and the
      # compiled-in pin must both equal it, so a release can never ship a pin
      # that differs from the root the publisher signs under.
      - name: Check the knowledge root pin
        env:
          EXPECTED: ${{ vars.KNOWLEDGE_ROOT_DIGEST }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED}" ]; then
            echo "KNOWLEDGE_ROOT_DIGEST is not set; the knowledge root pin is not checked."
            exit 0
          fi
          root="cli/internal/knowledgepin/root.json"
          pin="$(grep -o '"cncf-projects":[[:space:]]*"[^"]*"' cli/internal/knowledgepin/pin.go | sed 's/.*"\([^"]*\)"$/\1/')"
          if [ -z "${pin}" ]; then
            echo "KNOWLEDGE_ROOT_DIGEST is set but the compiled-in pin is empty; nothing was built."
            exit 1
          fi
          if [ ! -s "${root}" ]; then
            echo "KNOWLEDGE_ROOT_DIGEST is set but ${root} is missing; nothing was built."
            exit 1
          fi
          digest="sha256:$(sha256sum "${root}" | cut -d' ' -f1)"
          if [ "${EXPECTED}" != "${digest}" ] || [ "${pin}" != "${digest}" ]; then
            echo "KNOWLEDGE_ROOT_DIGEST, the digest of ${root} and the compiled-in pin are not all equal; nothing was built."
            exit 1
          fi

      # The release notes must exist before anything is built or attested:
      # a missing file found only in the last job would burn the tag.
      - name: Check the release notes exist
        run: |
          set -euo pipefail
          notes="cli/docs/release-notes-${GITHUB_REF_NAME}.md"
          if [ ! -s "${notes}" ]; then
            echo "Missing release notes ${notes}; nothing was built."
            exit 1
          fi

      # Defense in depth only: the tagged commit carries its own copy of this
      # workflow, so the real boundary is the tag ruleset on refs/tags/v*.
      # This stops the owner tagging a commit that is not on main's own
      # first-parent line (intermediate commits of a merged branch are
      # ancestors of main but were never CI-green on their own).
      - name: Check the tagged commit is on main
        env:
          TAGGED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mainline="$(git rev-list --first-parent refs/remotes/origin/main)"
          if ! grep -Fqx -- "${TAGGED_SHA}" <<<"${mainline}"; then
            echo "The tagged commit is not on the first-parent line of origin/main; nothing was built."
            exit 1
          fi

      # The exact toolchain patch release, so the same tag can be rebuilt and
      # compared; the attested identity embeds the Go version.
      # No cache: a tag build can restore caches that other workflow runs on
      # the default branch wrote, and a poisoned Go build cache entry would be
      # linked into a binary that is then attested as built from the tag.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.8"
          cache: false

      # The knowledge embedded in the binary must stay valid for a while after
      # the release: the earliest evidence validUntil over all embedded rules
      # (read by the code the binary itself uses) must be at least 30 days
      # after the tagged commit's date, so a release never ships rules that
      # answer UNKNOWN soon after it. Renewals must land before the tag.
      - name: Check the embedded knowledge is fresh
        working-directory: cli
        env:
          TAGGED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit_date="$(git log -1 --format=%cI "${TAGGED_SHA}")"
          go run ./cmd/prufyx-maintainer release-freshness --commit-date "${commit_date}" --min-days 30

      - name: Build binaries
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/prufyx_${VERSION}_${GOOS}_${GOARCH}
          mkdir -p dist/prufyx-collector_${VERSION}_${GOOS}_${GOARCH}

          # community-<os>-<arch> is a distinct build-identity profile family
          # (see internal/buildidentity): it is truthfully reported by
          # `prufyx version` as a community build, and it never satisfies the
          # strict linux-amd64/linux-arm64 profile the signed-release
          # pipeline (internal/maintainer/releaseworkflow) requires.
          BUILD_PROFILE="community-${GOOS}-${GOARCH}"

          # SOURCE_DATE_EPOCH is the tagged commit's own commit time, not the
          # workflow run time, so the same tag always reproduces the same
          # build identity.
          BUILD_EPOCH="$(git show -s --format=%ct "${SOURCE_REVISION}")"
          BUILD_EPOCH_RFC3339="$(date -u -d "@${BUILD_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"

          # A truthful digest of the exact source tree at the tagged commit,
          # and of the Community shipping policy that governs what the
          # strict release pipeline is allowed to ship. Neither claims the
          # full releasegate derivation ran here -- only that this binary was
          # built from this tree and can be checked against it.
          SOURCE_TREE_DIGEST="sha256:$(git archive "${SOURCE_REVISION}" | sha256sum | cut -d' ' -f1)"
          ALLOWLIST_DIGEST="sha256:$(sha256sum release/community-shipping-policy-v2.json | cut -d' ' -f1)"

          GO_VERSION="$(go env GOVERSION)"

          EMBEDDED_IDENTITY="PRUFYX_BUILD_IDENTITY_V1_BEGIN|${VERSION}|release|${SOURCE_REVISION}|${SOURCE_TREE_DIGEST}|${ALLOWLIST_DIGEST}|${BUILD_PROFILE}|${BUILD_EPOCH_RFC3339}|${GO_VERSION}|UNPINNED|true|PRUFYX_BUILD_IDENTITY_V1_END"

          LDFLAGS="-X github.com/prufyx/prufyx/cli/internal/buildidentity.Version=${VERSION}"
          LDFLAGS="${LDFLAGS} -X github.com/prufyx/prufyx/cli/internal/buildidentity.SourceRevision=${SOURCE_REVISION}"
          LDFLAGS="${LDFLAGS} -X github.com/prufyx/prufyx/cli/internal/buildidentity.SourceTreeDigest=${SOURCE_TREE_DIGEST}"
          LDFLAGS="${LDFLAGS} -X github.com/prufyx/prufyx/cli/internal/buildidentity.AllowlistDigest=${ALLOWLIST_DIGEST}"
          LDFLAGS="${LDFLAGS} -X github.com/prufyx/prufyx/cli/internal/buildidentity.BuildProfile=${BUILD_PROFILE}"
          LDFLAGS="${LDFLAGS} -X github.com/prufyx/prufyx/cli/internal/buildidentity.BuildEpoch=${BUILD_EPOCH}"
          LDFLAGS="${LDFLAGS} -X github.com/prufyx/prufyx/cli/internal/buildidentity.TrustRootDigest=UNPINNED"
          LDFLAGS="${LDFLAGS} -X github.com/prufyx/prufyx/cli/internal/buildidentity.EmbeddedIdentity=${EMBEDDED_IDENTITY}"

          go build -trimpath -buildvcs=false \
            -ldflags "${LDFLAGS}" \
            -o dist/prufyx_${VERSION}_${GOOS}_${GOARCH}/prufyx \
            ./cmd/prufyx-community

          go build -trimpath -buildvcs=false \
            -o dist/prufyx-collector_${VERSION}_${GOOS}_${GOARCH}/prufyx-collector \
            ./cmd/prufyx-collector

          # The binary must carry exactly the identity computed above. The
          # native target also runs its own identity check (exit 0 only when
          # every field and the embedded marker validate).
          bin="dist/prufyx_${VERSION}_${GOOS}_${GOARCH}/prufyx"
          if ! LC_ALL=C grep -q -a -F -- "${EMBEDDED_IDENTITY}" "${bin}"; then
            echo "The built binary does not carry the computed build identity."
            exit 1
          fi
          # The identity grep above is only a real check while -ldflags are
          # not recorded in the build info (-trimpath); without that, the
          # flag text itself would satisfy the grep.
          buildinfo="$(go version -m "${bin}")"
          if grep -q -- '-ldflags=' <<<"${buildinfo}"; then
            echo "The built binary records its linker flags in the build info."
            exit 1
          fi
          if [ "${GOOS}/${GOARCH}" = "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" ]; then
            "${bin}" version > /dev/null
          fi

          # BEGIN deterministic archives: the same tag gives the same bytes
          # (member order, mtimes from the tagged commit, numeric root owner,
          # normalized modes, no gzip name or time).
          for name in "prufyx_${VERSION}_${GOOS}_${GOARCH}" "prufyx-collector_${VERSION}_${GOOS}_${GOARCH}"; do
            tar --sort=name --format=gnu --mtime="@${BUILD_EPOCH}" \
              --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' \
              -C dist -cf - "${name}" | gzip -n > "dist/${name}.tar.gz"
          done
          # END deterministic archives

      - name: Upload archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archives-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            cli/dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  # .deb and .rpm of the linux prufyx binary. The package carries the very
  # binary of the attested tarball (checked below), so a package is never a
  # second build. No scripts, no signing: the packages are attested and listed
  # in SHA256SUMS by the provenance job like the archives.
  packages:
    name: Linux packages (.deb, .rpm)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Only the licence texts that travel with the binary (cone mode keeps
      # the root files LICENSE, NOTICE, THIRD-PARTY.md and
      # DATA-LICENSE.md).
      - name: Checkout licence files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: LICENSES

      - name: Download linux archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archives-linux-*
          path: archives
          merge-multiple: true

      - name: Build packages
        env:
          TAG: ${{ github.ref_name }}
          NFPM_VERSION: "2.48.0"
          NFPM_SHA256: "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750"
        run: |
          set -euo pipefail
          # Needed only to unpack the finished packages for the check below.
          # Installed first, so nothing is fetched after the nfpm digest check.
          if ! command -v rpm2cpio > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends rpm2cpio
          fi

          # Same epoch as the build job: the tagged commit's own commit time.
          BUILD_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          BUILD_MTIME="$(date -u -d "@${BUILD_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          export SOURCE_DATE_EPOCH="${BUILD_EPOCH}"
          PKG_VERSION="${TAG#v}"

          # nfpm is a pinned release binary with a pinned digest, not built
          # from source at run time.
          mkdir -p nfpm-bin pkgwork dist
          curl -fsSL --retry 3 --retry-all-errors -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz -C nfpm-bin nfpm

          # The licence files are copied and stamped with the build epoch:
          # the checkout's own file times differ from run to run, and nfpm
          # takes the times of tree members from the files.
          lic="pkgwork/licences"
          mkdir -p "${lic}"
          cp -R LICENSE NOTICE THIRD-PARTY.md DATA-LICENSE.md LICENSES "${lic}/"
          chmod -R u=rwX,go=rX "${lic}"
          find "${lic}" -exec touch -h -d "@${BUILD_EPOCH}" {} +

          for arch in amd64 arm64; do
            name="prufyx_${TAG}_linux_${arch}"
            work="pkgwork/${arch}"
            mkdir -p "${work}"
            tar -xzf "archives/${name}.tar.gz" -C "${work}"
            bin="${work}/${name}/prufyx"
            test -f "${bin}"

            cat > "${work}/nfpm.yaml" <<EOF
          name: prufyx
          arch: ${arch}
          platform: linux
          version: ${PKG_VERSION}
          section: utils
          maintainer: Prufyx <hello@prufyx.com>
          description: Checks Kubernetes upgrades against reviewed project knowledge.
          homepage: https://github.com/prufyx/prufyx
          license: AGPL-3.0-only
          mtime: ${BUILD_MTIME}
          contents:
            - src: ${bin}
              dst: /usr/bin/prufyx
              file_info:
                mode: 0755
                mtime: ${BUILD_MTIME}
            - src: ${lic}/LICENSE
              dst: /usr/share/doc/prufyx/LICENSE
              file_info:
                mode: 0644
                mtime: ${BUILD_MTIME}
            - src: ${lic}/NOTICE
              dst: /usr/share/doc/prufyx/NOTICE
              file_info:
                mode: 0644
                mtime: ${BUILD_MTIME}
            - src: ${lic}/THIRD-PARTY.md
              dst: /usr/share/doc/prufyx/THIRD-PARTY.md
              file_info:
                mode: 0644
                mtime: ${BUILD_MTIME}
            - src: ${lic}/DATA-LICENSE.md
              dst: /usr/share/doc/prufyx/DATA-LICENSE.md
              file_info:
                mode: 0644
                mtime: ${BUILD_MTIME}
            - src: ${lic}/LICENSES
              dst: /usr/share/doc/prufyx/LICENSES
              type: tree
              file_info:
                mtime: ${BUILD_MTIME}
          EOF

            for fmt in deb rpm; do
              out="dist/${name}.${fmt}"
              ./nfpm-bin/nfpm package --config "${work}/nfpm.yaml" --packager "${fmt}" --target "${out}"
              # The package must hold exactly the attested binary: a faulty
              # nfpm must not smuggle another one into an attested file.
              unpack="${work}/unpack-${fmt}"
              rm -rf "${unpack}" && mkdir -p "${unpack}"
              if [ "${fmt}" = deb ]; then
                dpkg-deb -x "${out}" "${unpack}"
              else
                (cd "${unpack}" && rpm2cpio "${GITHUB_WORKSPACE}/${out}" | cpio -idm --quiet)
              fi
              if ! cmp -s "${unpack}/usr/bin/prufyx" "${bin}"; then
                echo "${out} does not carry the binary of ${name}.tar.gz."
                exit 1
              fi
            done
          done
          ls -l dist

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-linux
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 7
          if-no-files-found: error

  provenance:
    name: Checksums and provenance
    needs: [build, packages]
    # Protected environment: the owner creates `release` with themselves as
    # required reviewer and tags `v*` as the only deployment refs. Provenance is
    # attested, and the draft release (which needs this job) is created,
    # only after that approval.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archives-*
          path: dist
          merge-multiple: true

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-linux
          path: dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.deb *.rpm > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  draft-release:
    name: Create draft release
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: cli/docs

      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: dist

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="cli/docs/release-notes-${GITHUB_REF_NAME}.md"
          if [ ! -s "${notes}" ]; then
            echo "Missing release notes ${notes}; no release was created."
            exit 1
          fi
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            "${flags[@]}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${notes}" \
            dist/*.tar.gz \
            dist/*.deb \
            dist/*.rpm \
            dist/SHA256SUMS
