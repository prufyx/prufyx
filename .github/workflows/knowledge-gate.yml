name: Knowledge gate

# Checks every change to the published knowledge (rule packs, corpus
# attestations, the support inventory, reattestation records) before it can
# merge, and re-derives every mechanical rule once a day.
#
# The gate code is always built from the live tip of main and only reads the
# proposed change's files: nothing from the change is executed. The trust
# control is the pull_request_target run (the workflow definition and the gate
# code come from the base branch, so a change cannot weaken its own gate). It
# holds no secrets beyond read-only tokens and never merges anything; it
# reports whether the change would be eligible for automatic merging, and
# for which head commit.
#
# Both trees are exported from git objects (never checked out), so the
# change's own .gitattributes cannot make the files the gate checks differ
# from the blobs that merge. A pull request is gated as it would land: the
# tree of merging the live tip of main and the change head (git merge-tree);
# a conflict fails.
#
# merge_group (the merge queue) is a CORRECTNESS check, not a trust control.
# A merge_group run executes the workflow definition of the queued commit,
# which is the pull request's own content, so the pull request can edit its
# own queue run. The queue run re-gates the exact queue commit against the
# queue base, so a main that moved since the pull request run is covered, and
# it requires GitHub's record of a successful pull_request_target run of this
# workflow on the pull request head (the only gate a change cannot rewrite).
# The queue run uses no secret: it runs in an environment that holds none and
# names none.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Re-derivation slice: day/7 (default), i/n, or all"
        required: false
        default: "day/7"

permissions:
  contents: read

concurrency:
  group: knowledge-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Knowledge gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The queue run gets an environment that holds no secrets; the read-only
    # App key lives in the environment of the pull_request_target run only.
    environment: ${{ github.event_name == 'merge_group' && 'knowledge-gate-queue' || 'knowledge-gate' }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      MQ_BASE_REF: ${{ github.event.merge_group.base_ref }}
      MQ_HEAD_REF: ${{ github.event.merge_group.head_ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      EVENT_SENDER: ${{ github.event.sender.login }}
      BOT_LOGIN: ${{ vars.KNOWLEDGE_BOT_LOGIN || 'prufyx-factory[bot]' }}
      REATTEST_TRUST_ROOT_DIGEST: ${{ vars.REATTEST_TRUST_ROOT_DIGEST }}
      WEB_APPROVAL_KEYS_DIGEST: ${{ vars.WEB_APPROVAL_KEYS_DIGEST }}
      # Any value but empty or "false" pauses the onboarding-bot tier (a typo
      # pauses, it never resumes).
      BOT_SIGNER_PAUSED: ${{ vars.KNOWLEDGE_BOT_SIGNER_PAUSED }}
      MAX_LOOSENING: ${{ vars.KNOWLEDGE_MAX_LOOSENING || '200' }}
      # A scheduled run re-derives one slice of the extractors (the slice is
      # the UTC day number mod 7), so every project is fully re-derived at
      # least weekly within the hourly request limit of the workflow token.
      SHARD: ${{ github.event.inputs.shard || 'day/7' }}
      MAX_DAILY_LOOSENING: ${{ vars.KNOWLEDGE_MAX_DAILY_LOOSENING || '50' }}
      MAX_WITHDRAW_PERCENT: ${{ vars.KNOWLEDGE_MAX_WITHDRAW_PERCENT || '5' }}
      MAX_WITHDRAW_PROJECT: ${{ vars.KNOWLEDGE_MAX_WITHDRAW_PROJECT || '20' }}
      # Shadow mode: a repository variable, or the "shadow" label on the
      # pull request. It can only make the gate stricter.
      SHADOW_VAR: ${{ vars.KNOWLEDGE_GATE_SHADOW }}
      SHADOW_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'shadow') }}
    outputs:
      result: ${{ steps.verify.outputs.result }}
      auto-merge-eligible: ${{ steps.verify.outputs.auto_merge_eligible }}
      # A consumer that merges must merge exactly this commit, and only
      # when this job succeeded.
      head-sha: ${{ steps.verify.outputs.head_sha }}
      alarm-count: ${{ steps.verify.outputs.alarm_count }}
    steps:
      - name: Resolve the base
        id: base
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          # Record when this job captured its variable snapshot. This is not
          # a live Variables API read and does not authorize private-key access.
          echo "ADMISSION_OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          if ! [[ "${HEAD_SHA}" =~ ${sha_re} ]]; then
            echo "The head commit id is not a full commit id."
            exit 1
          fi
          # The gate code always comes from the live tip of main, never from
          # the base or head commit of the event.
          tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if ! [[ "${tip}" =~ ${sha_re} ]]; then
            echo "Cannot resolve the tip of main."
            exit 1
          fi
          case "${GITHUB_EVENT_NAME}" in
            pull_request_target)
              # A change is gated as it would land on the live tip.
              base="${tip}"
              ;;
            merge_group)
              # The queue base is a chain of earlier queue entries on main,
              # not the live tip; the chain is checked against the tip once
              # the objects are fetched.
              if [ "${MQ_BASE_REF}" != "refs/heads/main" ]; then
                echo "The merge queue is not for main."
                exit 1
              fi
              base="${MQ_BASE_SHA}"
              if [ "${base}" = "${HEAD_SHA}" ]; then
                echo "The queue base equals the queue head: nothing would merge."
                exit 1
              fi
              ;;
            schedule|workflow_dispatch)
              base="${HEAD_SHA}"
              ;;
            *)
              echo "Unknown event ${GITHUB_EVENT_NAME}: the gate does not run."
              exit 1
              ;;
          esac
          if ! [[ "${base}" =~ ${sha_re} ]]; then
            echo "The base commit id is not a full commit id."
            exit 1
          fi
          echo "BASE_SHA=${base}" >> "${GITHUB_ENV}"
          echo "LIVE_TIP=${tip}" >> "${GITHUB_ENV}"
          echo "gate_sha=${tip}" >> "${GITHUB_OUTPUT}"

      - name: Check out the live main tip (gate code only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.base.outputs.gate_sha }}
          path: gate-src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: gate-src/cli/go.mod
          cache: false

      - name: Build the gate from the live main tip
        working-directory: gate-src/cli
        run: go build -buildvcs=false -trimpath -o "${RUNNER_TEMP}/prufyx-maintainer" ./cmd/prufyx-maintainer

      # Re-deriving the rules reads the upstream projects through the GitHub
      # REST API. The workflow token allows about 1000 requests an hour per
      # repository; a read-only GitHub App installation token allows 5000.
      # The App is optional: without it the gate keeps the workflow token and
      # the lower request cap. Nothing from the change runs in this job, so
      # the change never sees the token.
      - name: Create the read-only App token
        id: app-token
        if: github.event_name != 'merge_group' && vars.KNOWLEDGE_GATE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KNOWLEDGE_GATE_APP_ID }}
          private-key: ${{ secrets.KNOWLEDGE_GATE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-metadata: read

      - name: Fetch both commits and check how they relate
        run: |
          set -euo pipefail
          objects="${RUNNER_TEMP}/objects.git"
          git init -q --bare "${objects}"
          git -C "${objects}" fetch --no-tags --quiet "https://github.com/${GITHUB_REPOSITORY}.git" "+${BASE_SHA}:refs/admission/base"
          git -C "${objects}" fetch --no-tags --quiet "https://github.com/${GITHUB_REPOSITORY}.git" "+${LIVE_TIP}:refs/admission/tip"
          git -C "${objects}" fetch --no-tags --quiet "https://github.com/${HEAD_REPO}.git" "+${HEAD_SHA}:refs/admission/head"
          # Whether the head contains the base decides what the onboarding
          # admission may rely on (it reads the head's own git history).
          if git -C "${objects}" merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            echo "HEAD_CONTAINS_BASE=yes" >> "${GITHUB_ENV}"
          else
            echo "HEAD_CONTAINS_BASE=no" >> "${GITHUB_ENV}"
            if [ "${GITHUB_EVENT_NAME}" != "pull_request_target" ]; then
              echo "The head does not contain the base."
              exit 1
            fi
          fi
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            # The queue chain must contain the live tip of main.
            if ! git -C "${objects}" merge-base --is-ancestor "${LIVE_TIP}" "${BASE_SHA}"; then
              echo "The queue base does not contain the current tip of main."
              exit 1
            fi
          fi

      - name: Export both trees from git objects (no checkout, no attributes)
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/prufyx-maintainer" gate export --git-dir "${RUNNER_TEMP}/objects.git" --commit "${BASE_SHA}" --out base
          if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            # What would land: the live tip with the change merged in. A
            # conflict fails here.
            tree="$("${RUNNER_TEMP}/prufyx-maintainer" gate merge-tree --git-dir "${RUNNER_TEMP}/objects.git" --base "${BASE_SHA}" --head "${HEAD_SHA}")"
            "${RUNNER_TEMP}/prufyx-maintainer" gate export --git-dir "${RUNNER_TEMP}/objects.git" --tree "${tree}" --out head
          else
            "${RUNNER_TEMP}/prufyx-maintainer" gate export --git-dir "${RUNNER_TEMP}/objects.git" --commit "${HEAD_SHA}" --out head
          fi

      - name: List the change's commits
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}?per_page=100" \
            --jq '{status, ahead_by, behind_by, total_commits, commits: [.commits[] | {sha, author: (if .author then {login: .author.login} else null end), committer: (if .committer then {login: .committer.login} else null end), commit: {verification: {verified: .commit.verification.verified}}}]}' \
            > "${RUNNER_TEMP}/commits.json"; then
            echo "The commit list is unavailable; the change is not eligible for automatic merging."
            rm -f "${RUNNER_TEMP}/commits.json"
          fi

      # The queue run has no commit list of its own and no sender: both come
      # from GitHub's record of the pull request and of the gate's
      # pull_request_target run on its head, assembled here and decided by
      # the gate (gate verify --queue-merge).
      - name: Collect the queue entry's evidence
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_ref_re='^(refs/heads/)?gh-readonly-queue/main/pr-([1-9][0-9]{0,8})-[0-9a-f]{40}$'
          if ! [[ "${MQ_HEAD_REF}" =~ ${head_ref_re} ]]; then
            echo "The queue head ref does not name a pull request."
            exit 1
          fi
          number="${BASH_REMATCH[2]}"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
            --jq '{number, state, baseRef: .base.ref, headSha: .head.sha, userLogin: (.user.login // ""), commitCount: .commits}')"
          head_sha="$(jq -r '.headSha' <<<"${pr}")"
          commits="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${number}/commits?per_page=100" \
            --jq '.[] | {sha, parents: (.parents | length), author: (.author.login // ""), committer: (.committer.login // ""), verified: (.commit.verification.verified == true)}' | jq -s '.')"
          runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request_target&head_sha=${head_sha}&per_page=100" \
            --jq '.workflow_runs[] | {path, event, headSha: .head_sha, status, conclusion: (.conclusion // ""), createdAt: .created_at, actor: (.actor.login // ""), triggeringActor: (.triggering_actor.login // "")}' | jq -s '.')"
          parents="$(git -C "${RUNNER_TEMP}/objects.git" rev-list --parents -n 1 "${HEAD_SHA}")"
          jq -n --argjson pr "${pr}" --argjson commits "${commits}" --argjson runs "${runs}" \
            --arg parents "${parents}" --arg event "${GITHUB_EVENT_NAME}" \
            --arg baseRef "${MQ_BASE_REF}" --arg baseSha "${MQ_BASE_SHA}" \
            --arg headSha "${HEAD_SHA}" --arg headRef "${MQ_HEAD_REF}" \
            '{schema: "prufyx.io/knowledge-gate-queue-merge/v1", event: $event, baseRef: $baseRef, baseSha: $baseSha, headSha: $headSha, headRef: $headRef,
              mergeParents: ($parents | split(" ") | .[1:]), pullRequest: $pr, commits: $commits, runs: $runs}' \
            > "${RUNNER_TEMP}/queue-merge.json"

      - name: Count the loosening changes the automation merged in the last day
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Best effort: when anything here fails there is no count file,
          # the gate is not told a count, and the change is not eligible
          # for automatic merging (a missing count is never read as zero).
          # The commits and their parents are already in the object store:
          # the base fetch above brought the whole history of main.
          rm -f "${RUNNER_TEMP}/daily-count.txt"
          list="${RUNNER_TEMP}/daily-commits.json"
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/commits?sha=${BASE_SHA}&since=${since}&per_page=100" \
            --jq '.[] | {sha, parent: (.parents[0].sha // null), author: (.author.login // null)}' | jq -s '.' > "${list}"; then
            echo "The history of main is unavailable; the change is not eligible for automatic merging."
            exit 0
          fi
          if count="$("${RUNNER_TEMP}/prufyx-maintainer" gate daily-count --git-dir "${RUNNER_TEMP}/objects.git" --commits "${list}" --bot-login "${BOT_LOGIN}")"; then
            echo "${count}" > "${RUNNER_TEMP}/daily-count.txt"
          else
            echo "The count is unavailable; the change is not eligible for automatic merging."
          fi
          # Retain author observations covering the maximum onboarding validity
          # plus its daily window. The verifier checks exact Git membership and
          # parents; missing/oversized observations refuse v2 admission.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ] && [ -n "$(git -C "${RUNNER_TEMP}/objects.git" diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- cli/knowledge/onboarding)" ]; then
            admission_since="$(date -u -d '4 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/commits?sha=${BASE_SHA}&since=${admission_since}&per_page=100" \
              --jq '.[] | {sha, parent: (.parents[0].sha // null), author: (.author.login // null)}' | jq -s '.' > "${RUNNER_TEMP}/admission-commits.json"; then
              rm -f "${RUNNER_TEMP}/admission-commits.json"
            fi
          fi

      - name: Classify the change
        id: classify
        run: |
          set -euo pipefail
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${token}"
          "${RUNNER_TEMP}/prufyx-maintainer" gate classify --base base --head head
          echo "::${token}::"
          "${RUNNER_TEMP}/prufyx-maintainer" gate classify --base base --head head --json > "${RUNNER_TEMP}/classify.json"
          chains="$(jq -r '.chainsChanged | length' "${RUNNER_TEMP}/classify.json")"
          echo "chains_changed=${chains}" >> "${GITHUB_OUTPUT}"

      - name: Re-run the evidence check independently
        if: steps.classify.outputs.chains_changed != '0'
        working-directory: base
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          # The owner baseline file is read from the base, like the rule
          # packs: a statement can rely on an owner-chosen baseline only after
          # the file entry itself was admitted and merged.
          baselines=()
          if [ -f cli/knowledge/repin-baselines.json ]; then
            baselines=(--baselines cli/knowledge/repin-baselines.json)
          fi
          "${RUNNER_TEMP}/prufyx-maintainer" evidence repin \
            --rules cli/internal/cncfcheck/data/rules.json \
            --rules cli/internal/projectcheck/data/rules.json \
            --baseline release-line \
            "${baselines[@]}" \
            --output "${RUNNER_TEMP}/rerun-worklist.json"

      - name: Verify the change
        id: verify
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # The request cap stays below the hourly limit of the token in use.
          REST_BUDGET: ${{ vars.KNOWLEDGE_GATE_REST_BUDGET || (steps.app-token.outputs.token && '4000' || '900') }}
        run: |
          set -euo pipefail
          # Only the new bot profile fixes this request budget. Preserve the
          # existing manual owner-v1 route and its effective workflow budget.
          bot_v2="$(while IFS= read -r file; do
            if git -C "${RUNNER_TEMP}/objects.git" show "${HEAD_SHA}:${file}" | jq -e '.schema == "prufyx.io/knowledge-onboarding-batch/v2"' >/dev/null; then
              printf yes
              break
            fi
          done < <(git -C "${RUNNER_TEMP}/objects.git" diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- 'cli/knowledge/onboarding/*.json'))"
          if [ "${bot_v2}" = yes ]; then REST_BUDGET=900; fi
          args=(gate verify --base base --head head --source github
                --bot-login "${BOT_LOGIN}" --max-loosening "${MAX_LOOSENING}"
                --head-sha "${HEAD_SHA}" --rest-budget "${REST_BUDGET}"
                --max-withdraw-percent "${MAX_WITHDRAW_PERCENT}" --max-withdraw-project "${MAX_WITHDRAW_PROJECT}"
                --max-daily-loosening "${MAX_DAILY_LOOSENING}"
                --report "${RUNNER_TEMP}/gate-report.json" --summary "${GITHUB_STEP_SUMMARY}"
                --metrics "${RUNNER_TEMP}/gate-metrics.json"
                --alarms "${RUNNER_TEMP}/gate-alarms.json" --alarms-markdown "${RUNNER_TEMP}/gate-alarms.md")
          if [ "${BOT_SIGNER_PAUSED}" = false ] && [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ] && [ "${HEAD_CONTAINS_BASE}" = yes ] && [ -f "${RUNNER_TEMP}/admission-commits.json" ]; then
            args+=(--admission-git-dir "${RUNNER_TEMP}/objects.git"
                   --admission-base "${BASE_SHA}" --admission-head "${HEAD_SHA}"
                   --admission-daily-commits "${RUNNER_TEMP}/admission-commits.json"
                   --admission-paused false --admission-observed-at "${ADMISSION_OBSERVED_AT}")
          fi
          if [ -n "${BOT_SIGNER_PAUSED}" ] && [ "${BOT_SIGNER_PAUSED}" != "false" ]; then
            args+=(--bot-signer-paused)
          fi
          if [ "${SHADOW_VAR}" = "true" ] || [ "${SHADOW_LABEL}" = "true" ]; then
            args+=(--shadow)
          fi
          if [ -f "${RUNNER_TEMP}/daily-count.txt" ]; then
            args+=(--daily-loosening-count "$(cat "${RUNNER_TEMP}/daily-count.txt")")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            # No author, sender or commit list: the sender of a merge_group
            # event is the queue's own account. They come from the evidence.
            if [ ! -f "${RUNNER_TEMP}/queue-merge.json" ]; then
              echo "The queue entry's evidence is unavailable."
              exit 1
            fi
            args+=(--queue-merge "${RUNNER_TEMP}/queue-merge.json")
          else
            if [ -n "${PR_AUTHOR}" ]; then
              args+=(--author "${PR_AUTHOR}")
            fi
            if [ -n "${EVENT_SENDER}" ]; then
              args+=(--sender "${EVENT_SENDER}")
            fi
            if [ -f "${RUNNER_TEMP}/commits.json" ]; then
              args+=(--commits "${RUNNER_TEMP}/commits.json")
            fi
          fi
          if [ -n "${REATTEST_TRUST_ROOT_DIGEST}" ]; then
            args+=(--trust-root-digest "${REATTEST_TRUST_ROOT_DIGEST}")
          fi
          if [ -n "${WEB_APPROVAL_KEYS_DIGEST}" ]; then
            args+=(--approval-keys-digest "${WEB_APPROVAL_KEYS_DIGEST}")
          fi
          if [ -f "${RUNNER_TEMP}/rerun-worklist.json" ]; then
            args+=(--rerun-worklist "${RUNNER_TEMP}/rerun-worklist.json")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            args+=(--rederive-all --shard "${SHARD}")
          fi
          status=0
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${token}"
          "${RUNNER_TEMP}/prufyx-maintainer" "${args[@]}" || status=$?
          echo "::${token}::"
          if [ -f "${RUNNER_TEMP}/gate-report.json" ]; then
            echo "result=$(jq -r 'if .result == "pass" then "pass" else "fail" end' "${RUNNER_TEMP}/gate-report.json")" >> "${GITHUB_OUTPUT}"
            echo "auto_merge_eligible=$(jq -r 'if .autoMerge.eligible == true then "true" else "false" end' "${RUNNER_TEMP}/gate-report.json")" >> "${GITHUB_OUTPUT}"
            echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          fi
          if [ -f "${RUNNER_TEMP}/gate-alarms.json" ]; then
            echo "alarm_count=$(jq -r '.alarms | length' "${RUNNER_TEMP}/gate-alarms.json")" >> "${GITHUB_OUTPUT}"
          fi
          exit "${status}"

      - name: Keep the gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-gate-report
          path: |
            ${{ runner.temp }}/gate-report.json
            ${{ runner.temp }}/classify.json
            ${{ runner.temp }}/commits.json
            ${{ runner.temp }}/queue-merge.json
            ${{ runner.temp }}/gate-metrics.json
            ${{ runner.temp }}/gate-alarms.json
            ${{ runner.temp }}/gate-alarms.md
          if-no-files-found: ignore
          retention-days: 30

  # Opens or updates an issue for the alarms, in a separate repository the
  # owner names. It is a no-op until the owner creates the repository
  # variable and the secret. It runs no code of the change and holds no
  # repository permissions; it only posts text the gate wrote (every string
  # made safe to print and cut to 256 bytes). Alarms of pull requests are
  # reported only for the automation's own.
  alarm:
    name: Gate alarms
    needs: gate
    if: ${{ always() && github.event_name != 'merge_group' && needs.gate.outputs.alarm-count != '' && needs.gate.outputs.alarm-count != '0' && (github.event_name != 'pull_request_target' || github.event.pull_request.user.login == (vars.KNOWLEDGE_BOT_LOGIN || 'prufyx-factory[bot]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment: knowledge-alarms
    steps:
      - name: Get the alarm records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: knowledge-gate-report
          path: gate-files

      - name: Open or update the alarm issue
        env:
          OPS_ISSUES_REPO: ${{ vars.OPS_ISSUES_REPO }}
          OPS_ISSUES_TOKEN: ${{ secrets.OPS_ISSUES_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_ISSUES_TOKEN}" ] || [ -z "${OPS_ISSUES_REPO}" ]; then
            echo "No alarm channel is configured; the alarms stay in the gate report."
            exit 0
          fi
          repo_re='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          if ! [[ "${OPS_ISSUES_REPO}" =~ ${repo_re} ]]; then
            echo "The alarm repository name is not valid."
            exit 1
          fi
          files="$(find gate-files -name gate-alarms.md | head -n 1)"
          if [ -z "${files}" ]; then
            echo "No alarm records were kept."
            exit 1
          fi
          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            number_re='^[0-9]+$'
            if ! [[ "${PR_NUMBER}" =~ ${number_re} ]]; then
              echo "The pull request number is not valid."
              exit 1
            fi
            title="Knowledge gate alarms: pull request ${PR_NUMBER}"
          else
            title="Knowledge gate alarms: scheduled run"
          fi
          body="$(cat "${files}"; printf '\nRun: %s\n' "${RUN_URL}")"
          export GH_TOKEN="${OPS_ISSUES_TOKEN}"
          existing="$(gh issue list --repo "${OPS_ISSUES_REPO}" --state open --search "\"${title}\" in:title" --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${OPS_ISSUES_REPO}" --body "${body}"
          else
            gh issue create --repo "${OPS_ISSUES_REPO}" --title "${title}" --body "${body}"
          fi
