name: Knowledge gate

# Checks every change to the published knowledge (rule packs, corpus
# attestations, the support inventory, reattestation records) before it can
# merge, and re-derives every mechanical rule once a day.
#
# The gate is always built from the base branch and only reads the proposed
# change's files: nothing from the change is executed. That is why this
# workflow runs on pull_request_target (the workflow definition and the gate
# code come from the base branch, so a change cannot weaken its own gate).
# It holds no secrets beyond a read-only token and never merges anything; it
# reports whether the change would be eligible for automatic merging, and
# for which head commit.
#
# Both trees are exported from git objects (never checked out), so the
# change's own .gitattributes cannot make the files the gate checks differ
# from the blobs that merge. A pull request must be up to date with the
# current tip of main.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Re-derivation slice: day/7 (default), i/n, or all"
        required: false
        default: "day/7"

permissions:
  contents: read

concurrency:
  group: knowledge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Knowledge gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      EVENT_SENDER: ${{ github.event.sender.login }}
      BOT_LOGIN: ${{ vars.KNOWLEDGE_BOT_LOGIN || 'prufyx-factory[bot]' }}
      REATTEST_TRUST_ROOT_DIGEST: ${{ vars.REATTEST_TRUST_ROOT_DIGEST }}
      WEB_APPROVAL_KEYS_DIGEST: ${{ vars.WEB_APPROVAL_KEYS_DIGEST }}
      MAX_LOOSENING: ${{ vars.KNOWLEDGE_MAX_LOOSENING || '200' }}
      # A scheduled run re-derives one slice of the extractors (the slice is
      # the UTC day number mod 7), so every project is fully re-derived at
      # least weekly within the hourly request limit of the workflow token.
      SHARD: ${{ github.event.inputs.shard || 'day/7' }}
      REST_BUDGET: ${{ vars.KNOWLEDGE_GATE_REST_BUDGET || '900' }}
      MAX_DAILY_LOOSENING: ${{ vars.KNOWLEDGE_MAX_DAILY_LOOSENING || '50' }}
      MAX_WITHDRAW_PERCENT: ${{ vars.KNOWLEDGE_MAX_WITHDRAW_PERCENT || '5' }}
      MAX_WITHDRAW_PROJECT: ${{ vars.KNOWLEDGE_MAX_WITHDRAW_PROJECT || '20' }}
      # Shadow mode: a repository variable, or the "shadow" label on the
      # pull request. It can only make the gate stricter.
      SHADOW_VAR: ${{ vars.KNOWLEDGE_GATE_SHADOW }}
      SHADOW_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'shadow') }}
    outputs:
      result: ${{ steps.verify.outputs.result }}
      auto-merge-eligible: ${{ steps.verify.outputs.auto_merge_eligible }}
      # A consumer that merges must merge exactly this commit, and only
      # when this job succeeded.
      head-sha: ${{ steps.verify.outputs.head_sha }}
      alarm-count: ${{ steps.verify.outputs.alarm_count }}
    steps:
      - name: Resolve the base
        id: base
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          if ! [[ "${HEAD_SHA}" =~ ${sha_re} ]]; then
            echo "The head commit id is not a full commit id."
            exit 1
          fi
          case "${GITHUB_EVENT_NAME}" in
            pull_request_target)
              tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
              if ! [[ "${tip}" =~ ${sha_re} ]]; then
                echo "Cannot resolve the tip of main."
                exit 1
              fi
              if [ "${PR_BASE_SHA}" != "${tip}" ]; then
                echo "main has moved since this run was triggered; update the branch so the gate compares exactly what would merge."
                exit 1
              fi
              base="${tip}"
              ;;
            *)
              base="${HEAD_SHA}"
              ;;
          esac
          if ! [[ "${base}" =~ ${sha_re} ]]; then
            echo "The base commit id is not a full commit id."
            exit 1
          fi
          echo "BASE_SHA=${base}" >> "${GITHUB_ENV}"
          echo "sha=${base}" >> "${GITHUB_OUTPUT}"

      - name: Check out the base (gate code only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: gate-src
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: gate-src/cli/go.mod
          cache: false

      - name: Build the gate from the base
        working-directory: gate-src/cli
        run: go build -buildvcs=false -trimpath -o "${RUNNER_TEMP}/prufyx-maintainer" ./cmd/prufyx-maintainer

      - name: Fetch both commits and require the head to contain the base
        run: |
          set -euo pipefail
          objects="${RUNNER_TEMP}/objects.git"
          git init -q --bare "${objects}"
          git -C "${objects}" fetch --no-tags --quiet "https://github.com/${GITHUB_REPOSITORY}.git" "${BASE_SHA}"
          git -C "${objects}" fetch --no-tags --quiet "https://github.com/${HEAD_REPO}.git" "${HEAD_SHA}"
          if ! git -C "${objects}" merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            echo "The change does not contain the current base; update it so the gate compares exactly what would merge."
            exit 1
          fi

      - name: Export both trees from git objects (no checkout, no attributes)
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/prufyx-maintainer" gate export --git-dir "${RUNNER_TEMP}/objects.git" --commit "${BASE_SHA}" --out base
          "${RUNNER_TEMP}/prufyx-maintainer" gate export --git-dir "${RUNNER_TEMP}/objects.git" --commit "${HEAD_SHA}" --out head

      - name: List the change's commits
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}?per_page=100" \
            --jq '{status, ahead_by, behind_by, total_commits, commits: [.commits[] | {sha, author: (if .author then {login: .author.login} else null end), committer: (if .committer then {login: .committer.login} else null end), commit: {verification: {verified: .commit.verification.verified}}}]}' \
            > "${RUNNER_TEMP}/commits.json"; then
            echo "The commit list is unavailable; the change is not eligible for automatic merging."
            rm -f "${RUNNER_TEMP}/commits.json"
          fi

      - name: Count the loosening changes the automation merged in the last day
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Best effort: when anything here fails there is no count file,
          # the gate is not told a count, and the change is not eligible
          # for automatic merging (a missing count is never read as zero).
          # The commits and their parents are already in the object store:
          # the base fetch above brought the whole history of main.
          rm -f "${RUNNER_TEMP}/daily-count.txt"
          list="${RUNNER_TEMP}/daily-commits.json"
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/commits?sha=${BASE_SHA}&since=${since}&per_page=100" \
            --jq '.[] | {sha, parent: (.parents[0].sha // null), author: (.author.login // null)}' | jq -s '.' > "${list}"; then
            echo "The history of main is unavailable; the change is not eligible for automatic merging."
            exit 0
          fi
          if count="$("${RUNNER_TEMP}/prufyx-maintainer" gate daily-count --git-dir "${RUNNER_TEMP}/objects.git" --commits "${list}" --bot-login "${BOT_LOGIN}")"; then
            echo "${count}" > "${RUNNER_TEMP}/daily-count.txt"
          else
            echo "The count is unavailable; the change is not eligible for automatic merging."
          fi

      - name: Classify the change
        id: classify
        run: |
          set -euo pipefail
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${token}"
          "${RUNNER_TEMP}/prufyx-maintainer" gate classify --base base --head head
          echo "::${token}::"
          "${RUNNER_TEMP}/prufyx-maintainer" gate classify --base base --head head --json > "${RUNNER_TEMP}/classify.json"
          chains="$(jq -r '.chainsChanged | length' "${RUNNER_TEMP}/classify.json")"
          echo "chains_changed=${chains}" >> "${GITHUB_OUTPUT}"

      - name: Re-run the evidence check independently
        if: steps.classify.outputs.chains_changed != '0'
        working-directory: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The owner baseline file is read from the base, like the rule
          # packs: a statement can rely on an owner-chosen baseline only after
          # the file entry itself was admitted and merged.
          baselines=()
          if [ -f cli/knowledge/repin-baselines.json ]; then
            baselines=(--baselines cli/knowledge/repin-baselines.json)
          fi
          "${RUNNER_TEMP}/prufyx-maintainer" evidence repin \
            --rules cli/internal/cncfcheck/data/rules.json \
            --rules cli/internal/projectcheck/data/rules.json \
            --baseline release-line \
            "${baselines[@]}" \
            --output "${RUNNER_TEMP}/rerun-worklist.json"

      - name: Verify the change
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(gate verify --base base --head head --source github
                --bot-login "${BOT_LOGIN}" --max-loosening "${MAX_LOOSENING}"
                --head-sha "${HEAD_SHA}" --rest-budget "${REST_BUDGET}"
                --max-withdraw-percent "${MAX_WITHDRAW_PERCENT}" --max-withdraw-project "${MAX_WITHDRAW_PROJECT}"
                --max-daily-loosening "${MAX_DAILY_LOOSENING}"
                --report "${RUNNER_TEMP}/gate-report.json" --summary "${GITHUB_STEP_SUMMARY}"
                --metrics "${RUNNER_TEMP}/gate-metrics.json"
                --alarms "${RUNNER_TEMP}/gate-alarms.json" --alarms-markdown "${RUNNER_TEMP}/gate-alarms.md")
          if [ "${SHADOW_VAR}" = "true" ] || [ "${SHADOW_LABEL}" = "true" ]; then
            args+=(--shadow)
          fi
          if [ -f "${RUNNER_TEMP}/daily-count.txt" ]; then
            args+=(--daily-loosening-count "$(cat "${RUNNER_TEMP}/daily-count.txt")")
          fi
          if [ -n "${PR_AUTHOR}" ]; then
            args+=(--author "${PR_AUTHOR}")
          fi
          if [ -n "${EVENT_SENDER}" ]; then
            args+=(--sender "${EVENT_SENDER}")
          fi
          if [ -f "${RUNNER_TEMP}/commits.json" ]; then
            args+=(--commits "${RUNNER_TEMP}/commits.json")
          fi
          if [ -n "${REATTEST_TRUST_ROOT_DIGEST}" ]; then
            args+=(--trust-root-digest "${REATTEST_TRUST_ROOT_DIGEST}")
          fi
          if [ -n "${WEB_APPROVAL_KEYS_DIGEST}" ]; then
            args+=(--approval-keys-digest "${WEB_APPROVAL_KEYS_DIGEST}")
          fi
          if [ -f "${RUNNER_TEMP}/rerun-worklist.json" ]; then
            args+=(--rerun-worklist "${RUNNER_TEMP}/rerun-worklist.json")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            args+=(--rederive-all --shard "${SHARD}")
          fi
          status=0
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${token}"
          "${RUNNER_TEMP}/prufyx-maintainer" "${args[@]}" || status=$?
          echo "::${token}::"
          if [ -f "${RUNNER_TEMP}/gate-report.json" ]; then
            echo "result=$(jq -r 'if .result == "pass" then "pass" else "fail" end' "${RUNNER_TEMP}/gate-report.json")" >> "${GITHUB_OUTPUT}"
            echo "auto_merge_eligible=$(jq -r 'if .autoMerge.eligible == true then "true" else "false" end' "${RUNNER_TEMP}/gate-report.json")" >> "${GITHUB_OUTPUT}"
            echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          fi
          if [ -f "${RUNNER_TEMP}/gate-alarms.json" ]; then
            echo "alarm_count=$(jq -r '.alarms | length' "${RUNNER_TEMP}/gate-alarms.json")" >> "${GITHUB_OUTPUT}"
          fi
          exit "${status}"

      - name: Keep the gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-gate-report
          path: |
            ${{ runner.temp }}/gate-report.json
            ${{ runner.temp }}/classify.json
            ${{ runner.temp }}/commits.json
            ${{ runner.temp }}/gate-metrics.json
            ${{ runner.temp }}/gate-alarms.json
            ${{ runner.temp }}/gate-alarms.md
          if-no-files-found: ignore
          retention-days: 30

  # Opens or updates an issue for the alarms, in a separate repository the
  # owner names. It is a no-op until the owner creates the repository
  # variable and the secret. It runs no code of the change and holds no
  # repository permissions; it only posts text the gate wrote (every string
  # made safe to print and cut to 256 bytes). Alarms of pull requests are
  # reported only for the automation's own.
  alarm:
    name: Gate alarms
    needs: gate
    if: ${{ always() && needs.gate.outputs.alarm-count != '' && needs.gate.outputs.alarm-count != '0' && (github.event_name != 'pull_request_target' || github.event.pull_request.user.login == (vars.KNOWLEDGE_BOT_LOGIN || 'prufyx-factory[bot]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment: knowledge-alarms
    steps:
      - name: Get the alarm records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: knowledge-gate-report
          path: gate-files

      - name: Open or update the alarm issue
        env:
          OPS_ISSUES_REPO: ${{ vars.OPS_ISSUES_REPO }}
          OPS_ISSUES_TOKEN: ${{ secrets.OPS_ISSUES_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_ISSUES_TOKEN}" ] || [ -z "${OPS_ISSUES_REPO}" ]; then
            echo "No alarm channel is configured; the alarms stay in the gate report."
            exit 0
          fi
          repo_re='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          if ! [[ "${OPS_ISSUES_REPO}" =~ ${repo_re} ]]; then
            echo "The alarm repository name is not valid."
            exit 1
          fi
          files="$(find gate-files -name gate-alarms.md | head -n 1)"
          if [ -z "${files}" ]; then
            echo "No alarm records were kept."
            exit 1
          fi
          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            number_re='^[0-9]+$'
            if ! [[ "${PR_NUMBER}" =~ ${number_re} ]]; then
              echo "The pull request number is not valid."
              exit 1
            fi
            title="Knowledge gate alarms: pull request ${PR_NUMBER}"
          else
            title="Knowledge gate alarms: scheduled run"
          fi
          body="$(cat "${files}"; printf '\nRun: %s\n' "${RUN_URL}")"
          export GH_TOKEN="${OPS_ISSUES_TOKEN}"
          existing="$(gh issue list --repo "${OPS_ISSUES_REPO}" --state open --search "\"${title}\" in:title" --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${OPS_ISSUES_REPO}" --body "${body}"
          else
            gh issue create --repo "${OPS_ISSUES_REPO}" --title "${title}" --body "${body}"
          fi
