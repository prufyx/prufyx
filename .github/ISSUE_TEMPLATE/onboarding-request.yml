name: Project onboarding request
description: For maintainers. If your project is not in Prufyx yet, this is how you bring it in faster; fields map to "prufyx-maintainer project init".
title: "[onboarding] "
labels:
  - maintainer-intake
body:
  - type: markdown
    attributes:
      value: |
        If your project is not in Prufyx yet, this is how you bring it in faster. It is for a maintainer of the project. Submitting this form is a request, not a coverage claim: it does not add a rule, assert compatibility, or publish a project.

        Once the automatic check is enabled, maintainer status is checked from the project's own public files: a login listed in the root CODEOWNERS ('*' entry), the OWNERS approvers or the MAINTAINERS file shows the entry was kept in the project's own files. That is not proof that the person maintains the project; otherwise we ask for an invitation. Status updates will then appear as comments on this issue. Until the automatic check is live, the Prufyx maintainers check and reply on the issue by hand. How: [docs/maintainers.md](https://github.com/prufyx/prufyx/blob/main/docs/maintainers.md#intake-is-for-project-maintainers).

        Fields map one-to-one to `prufyx-maintainer project init` (see [project onboarding](https://github.com/prufyx/prufyx/blob/main/cli/docs/project-onboarding.md)). A reviewer builds the request file, runs `project validate`, then `project sync`.

        This issue is public. Do not include email addresses, customer data, cluster data, credentials, or private links.
  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Exact canonical HTTPS URL with two path segments. No .git, query, fragment, or trailing slash.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Slug (optional)
      description: Lowercase stable slug. Left empty, the tool derives one.
      placeholder: my-project
  - type: input
    id: release-limit
    attributes:
      label: Recent releases to observe
      description: Integer 1 to 10. Default 5.
      placeholder: "5"
  - type: input
    id: tag-prefix
    attributes:
      label: Tag prefix (optional)
      description: Only for repositories that tag several components. May end in /.
      placeholder: operator/
  - type: textarea
    id: changelog-paths
    attributes:
      label: Changelog or upgrade-guide paths (optional)
      description: One repository-relative path per line, at most 8. Replaces the defaults (CHANGELOG.md, CHANGES.md, CHANGES, RELEASES.md, docs/CHANGELOG.md).
      placeholder: |
        CHANGELOG.md
        docs/upgrade.md
  - type: dropdown
    id: license-disposition
    attributes:
      label: License declaration
      options:
        - NOT_REVIEWED
        - DECLARED_UNKNOWN
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: The repository is public and I included no private or personal data.
          required: true
